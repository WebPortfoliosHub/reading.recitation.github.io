    <section class="quran-section py-5 mt-5" id="myDemo">
        <div class="container">
            <h2 class="text-center mb-4 heading-green">Explore the Quran</h2>

            <!-- Search Input -->
            <input type="text" class="form-control mb-4" id="surahSearch" placeholder="Search for Surah...">

            <!-- Surah Card Container -->
            <div class="row justify-content-center" id="surahCard">
                <!-- Surah Cards will appear here -->

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let allSurahs = [];

        // Fetch Surah Data from API
        fetch('https://api.alquran.cloud/v1/surah')
            .then(response => response.json())
            .then(data => {
                allSurahs = data.data;
                displaySurahs(allSurahs); // Display all Surahs initially
            })
            .catch(error => console.error('Error fetching Surah data:', error));

        // Display Surahs on the page
        function displaySurahs(surahs) {
            const surahCardContainer = document.getElementById('surahCard');
            surahCardContainer.innerHTML = ''; // Clear previous results

            surahs.forEach(surah => {
                const formattedSurahNumber = surah.number.toString().padStart(3, '0');
                const surahCard = `
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card p-3">
                            <div class="card-body text-center">
                                <h5 class="card-title">${surah.englishName}</h5>
                                <p class="card-text">${surah.englishNameTranslation} - Surah ${surah.number} (${surah.numberOfAyahs} Ayahs)</p>
                                <select class="form-select mb-3">
                                    <option value="en">English Translation</option>
                                    <option value="ar">Arabic (Original)</option>
                                </select>
                                <a href="https://quran.com/${surah.number}" target="_blank" class="btn btn-outline-primary">Read Surah</a>
                                <button class="btn btn-outline-success" onclick="playAudio(${surah.number})">Listen to Surah</button>
                                <div id="audioPlayer${surah.number}"></div>
                            </div>
                        </div>
                    </div>
                `;
                surahCardContainer.innerHTML += surahCard;
            });
        }

        // Search and Filter Surahs
        document.getElementById('surahSearch').addEventListener('input', function () {
            const searchValue = this.value.toLowerCase();
            const filteredSurahs = allSurahs.filter(surah =>
                surah.englishName.toLowerCase().includes(searchValue)
            );
            displaySurahs(filteredSurahs);
        });

        // Function to play audio for the Surah
        // Function to play audio for the Surah
        // Function to play audio for the Surah
        async function playAudio(surahNumber) {
            const reciterId = 1; // Replace with the desired reciter ID
            const apiUrl = `https://api.quran.com/api/v4/chapter_recitations/${reciterId}/${surahNumber}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                const audioUrl = data.audio_file.audio_url;

                // Check if the audio player already exists
                const audioContainer = document.getElementById(`audioPlayer${surahNumber}`);
                audioContainer.innerHTML = ''; // Clear previous audio player

                // Create and append the audio element dynamically
                const audioElement = document.createElement('audio');
                audioElement.controls = true;
                audioElement.src = audioUrl;

                audioElement.addEventListener('error', function () {
                    alert('Audio failed to load. Please try again later.');
                });

                audioContainer.appendChild(audioElement);
                audioElement.play(); // Try to play the audio immediately
            } catch (error) {
                console.error('Error fetching audio URL:', error);
                alert('Failed to load audio. Please try again later.');
            }
        }


    </script>
